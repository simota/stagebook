name: ci
# #TODO(agent): UNVERIFIED — no pull request has run this yet (the repository has no remote). Open one and read the run.

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ./scripts/verify.sh --full
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-output
          include-hidden-files: true
          path: |
            .verify/
            test-results/
